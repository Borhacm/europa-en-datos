# Calendario editorial de Europa en datos.
#
# Las tareas automáticas toman, en este orden, la primera entrada de su tipo que todavía no esté hecha.
# Una entrada está hecha si ya existe su archivo de contenido en main
# (web/src/content/notes/<id>.ts o web/src/content/themes/<tema>.ts) o si tiene un pull request abierto
# en una rama que empieza por editorial/<id>.
#
# Puedes reordenar, añadir o quitar entradas cuando quieras. Campos:
#   id        identificador (n01, a01...). Para las notas es también el prefijo de sus gráficos.
#   tipo      nota | articulo
#   titulo    idea de título (la tarea lo ajusta a lo que digan los datos)
#   angulo    qué se quiere contar
#   mirada    (notas) gigantes | elige | dentro
#   tema      (notas) tema al que pertenece: ia-digital, comercio, productividad, libertades...
#   tema_id   (artículos) id del tema nuevo, en minúsculas y sin acentos
#   codigo    (artículos) prefijo de dos letras de sus gráficos (SA-G1...)
#   fuentes   datasets candidatos; hay que comprobar que existen y tienen datos recientes
#   relacionada  (artículos) nota que adelantó el tema: el artículo la enlaza

